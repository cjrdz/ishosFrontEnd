name: Frontend CI

on:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.mjs"
      - "svelte.config.js"
      - "wrangler.jsonc"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.mjs"
      - "svelte.config.js"
      - "wrangler.jsonc"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/frontend-ci.yml"

# Read-only token: this workflow only checks out and builds.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck and Astro validation
        run: pnpm lint

      - name: Store bundle boundary
        run: pnpm check:store-boundary

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build
