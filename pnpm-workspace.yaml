packages:
  - '.'

allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - js-yaml@4.3.0
  - svgo@4.0.2
  - fast-uri@3.1.4
  - sharp@0.35.0
  - postcss@8.5.12 || 8.5.18
  - tar@7.5.21
  - brace-expansion@5.0.8
  - '@astrojs/cloudflare@14.4.8'
  - '@astrojs/markdown-satteri@0.4.10'
  - '@astrojs/svelte-renderer@0.1.2'
  - '@astrojs/svelte@9.1.6'
  - '@astrojs/vite-plugin-astro@0.1.3'
  - astro@7.4.12
  - '@astrojs/vercel@11.0.22'

overrides:
  # astro check breaks if a 2.0 beta runtime is paired with the 1.x core.
  '@emnapi/core': ^1.11.3
  '@emnapi/runtime': ^1.11.3
  undici: ^7.28.0
  ws: ^8.21.0
  path-to-regexp: ^6.3.0
  esbuild: ^0.28.1
  echarts: ^6.1.0
  yaml: '>=2.8.3'
  brace-expansion@<=5.0.7: ^5.0.8
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  svgo@>=4.0.0 <4.0.2: ^4.0.2
  tar@<=7.5.20: ^7.5.21
  zod@>=4.0.0 <4.6.6: ^4.6.7
